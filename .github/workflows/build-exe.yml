name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version numerica de la app (ej. 3.2.1)'
        required: true
        default: '3.2.1'
        type: string

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile with Nuitka (includes ffmpeg download + smoke test)
        env:
          APP_VERSION: ${{ inputs.version || '3.2.1' }}
        run: python scripts/build_release.py --version "$APP_VERSION" --build-type Release --signing unsigned

      - name: Package final application
        env:
          APP_VERSION: ${{ inputs.version || '3.2.1' }}
        run: python scripts/build_release.py --package-only --version "$APP_VERSION" --build-type Release --signing unsigned

      - name: Upload final download
        uses: actions/upload-artifact@v4
        with:
          name: TikTokStreamKeyGenerator-exe-windows-x64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
